syntax = "proto3";

package erp;

import "api.proto";

option go_package = "./types/example";

message EmployeeList {
  repeated Employee list = 1;
  l8api.L8MetaData metadata = 2;
}

message Employee {
  string id = 1;
  string name = 2;
  repeated Addr addresses = 3;
}

message AddressList {
  repeated Employee list = 1;
  l8api.L8MetaData metadata = 2;
}

message Addr {
  string line1 = 1;
  string line2 = 2;
  int32 zip = 3;
}